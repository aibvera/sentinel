# Sentinel: recorder (grabación por movimiento) + api (detección y datos) + web (interfaz).
# Todos leen el mismo .env de la raíz.
# Videos y base de datos viven en carpetas del host (bind mounts), accesibles fuera del compose.

# Nombre propio para no mezclarse con otros proyectos de compose llamados "sentinel".
name: sentinel-cctv

x-host-user: &host-user
  # En Linux, para que los archivos queden a tu nombre: HOST_UID=$(id -u) HOST_GID=$(id -g) en .env.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

x-after-init: &after-init
  depends_on:
    init:
      condition: service_completed_successfully

services:
  # Si las carpetas del host no existen, Docker las crea como root y el recorder y la api
  # (que no corren como root) no pueden escribir en ellas. Este paso las crea y les asigna dueño.
  init:
    image: busybox:1.37
    command: chown "${HOST_UID:-1000}:${HOST_GID:-1000}" /recordings /data
    volumes:
      - ${HOST_RECORDINGS:-./recordings}:/recordings
      - ${HOST_DATA:-./data}:/data

  recorder:
    build: ./recorder
    <<: [*host-user, *after-init]
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      SAVE_PATH: /recordings
    volumes:
      - ${HOST_RECORDINGS:-./recordings}:/recordings

  api:
    build: ./api
    <<: [*host-user, *after-init]
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      RECORDINGS_PATH: /recordings
      DATA_PATH: /data
    volumes:
      - ${HOST_RECORDINGS:-./recordings}:/recordings:ro
      - ${HOST_DATA:-./data}:/data
    # Deja la mitad de la CPU libre para el recorder y el sistema.
    cpus: ${API_CPUS:-4}
    mem_limit: 2g
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 0.0.0.0: la web queda abierta a la red local (http://IP_DEL_EQUIPO:8080), no solo a localhost.
      - "0.0.0.0:${WEB_PORT:-8080}:80"
